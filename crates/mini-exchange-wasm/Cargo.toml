[package]
name = "mini-exchange-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser session around FastEngine and the deterministic simulators"
license = "MIT"
publish = false
repository = "https://github.com/Pizzasamrad/mini-exchange"

[lib]
crate-type = ["cdylib", "rlib"]
name = "mini_exchange_wasm"

[dependencies]
mini-exchange = { path = "../.." }
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"

[dev-dependencies]
serde_json = "1"
