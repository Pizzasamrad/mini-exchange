name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  build:
    name: Build wasm demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: |
          set -euo pipefail
          ver="${WASM_BINDGEN_VERSION}"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${ver}/wasm-bindgen-${ver}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | tar -xz
          mkdir -p "${HOME}/.local/bin"
          install -m 755 "wasm-bindgen-${ver}-x86_64-unknown-linux-musl/wasm-bindgen" "${HOME}/.local/bin/wasm-bindgen"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/wasm-bindgen" --version

      - name: Build the site
        run: ./web/build.sh

      - name: Stage Pages output
        run: |
          mkdir -p _site
          cp web/index.html web/styles.css web/app.js _site/
          cp -a web/pkg _site/pkg
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
